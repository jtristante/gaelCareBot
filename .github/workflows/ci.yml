name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-and-push]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose files to deploy dir
        run: cp docker-compose.yml docker-compose.prod.yml Dockerfile.sqlite-web .env.example /opt/gaelcarebot/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="latest"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Pull image with retry
        working-directory: /opt/gaelcarebot
        run: |
          sed -i "s/:latest/:${TAG}/" docker-compose.prod.yml
          if [ "${TAG}" != "latest" ]; then
            echo "Versioned tag detected — waiting for image to be available (max 5 attempts)..."
            for i in $(seq 1 5); do
              echo "Attempt $i/5 — checking ghcr.io/${{ github.repository }}:${TAG}..."
              if docker manifest inspect "ghcr.io/${{ github.repository }}:${TAG}" > /dev/null 2>&1; then
                echo "Image found on attempt $i"
                break
              fi
              if [ "$i" -eq 5 ]; then
                echo "Image not found after 5 attempts"
                exit 1
              fi
              echo "Not ready — retrying in 30s..."
              sleep 30
            done
          fi
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull gaelcarebot
          echo "Image pulled successfully"

      - name: Build sqlite-web
        working-directory: /opt/gaelcarebot
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml build sqlite-web

      - name: Restart services
        working-directory: /opt/gaelcarebot
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

      - name: Wait for healthcheck
        working-directory: /opt/gaelcarebot
        run: |
          echo "Waiting for container to become healthy..."
          for i in $(seq 1 12); do
            health=$(docker inspect --format='{{.State.Health.Status}}' gaelcarebot 2>/dev/null || echo "not-found")
            if [ "$health" = "healthy" ]; then
              echo "Container is healthy!"
              exit 0
            fi
            echo "Attempt $i/12 (current: ${health}) — waiting 10s..."
            sleep 10
          done
          echo "Healthcheck failed after 120s — last status: ${health}"
          exit 1

      - name: Clean up old images
        working-directory: /opt/gaelcarebot
        run: docker image prune -f
